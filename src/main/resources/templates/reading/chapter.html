<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head(${chapter.title} + ' - ' + ${book.title} + ' - 在线书屋')"></head>
<body>
    <nav th:replace="fragments/layout :: navbar"></nav>

    <main class="container mt-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">首页</a></li>
                <li class="breadcrumb-item"><a href="/books">书库</a></li>
                <li class="breadcrumb-item"><a th:href="@{/books/{id}(id=${book.id})}" th:text="${book.title}">书名</a></li>
                <li class="breadcrumb-item active" th:text="${chapter.title}">章节</li>
            </ol>
        </nav>

        <div class="row">
            <div class="col-lg-8">
                <div class="card shadow-sm reading-content">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <h3 th:text="${book.title}">书名</h3>
                            <h5 class="text-muted" th:text="${chapter.title}">章节标题</h5>
                        </div>
                        <hr>
                        <div class="chapter-text" th:utext="${chapter.content}">
                            章节内容
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-between mt-4 mb-5">
                    <a th:if="${hasPrev}" th:href="@{/reading/{bookId}/{chapterNumber}(bookId=${book.id}, chapterNumber=${prevChapter.chapterNumber})}" class="btn btn-outline-primary">
                        <i class="bi bi-chevron-left"></i> <span th:text="${prevChapter.title}">上一章</span>
                    </a>
                    <span th:if="!${hasPrev}"></span>
                    <a th:if="${hasNext}" th:href="@{/reading/{bookId}/{chapterNumber}(bookId=${book.id}, chapterNumber=${nextChapter.chapterNumber})}" class="btn btn-outline-primary">
                        <span th:text="${nextChapter.title}">下一章</span> <i class="bi bi-chevron-right"></i>
                    </a>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h5 class="mb-0"><i class="bi bi-list-ul"></i> 目录</h5>
                    </div>
                    <div class="card-body p-0" style="max-height: 500px; overflow-y: auto;">
                        <div class="list-group list-group-flush">
                            <a th:each="ch : ${chapters}"
                               th:href="@{/reading/{bookId}/{chapterNumber}(bookId=${book.id}, chapterNumber=${ch.chapterNumber})}"
                               class="list-group-item list-group-item-action d-flex align-items-center"
                               th:classappend="${ch.id == chapter.id} ? 'active' : ''">
                                <span class="badge bg-primary rounded-pill me-2" th:text="${ch.chapterNumber}">1</span>
                                <span th:text="${ch.title}">章节标题</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
