<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('登录 - 在线书屋')"></head>
<body>
    <nav th:replace="fragments/layout :: navbar"></nav>

    <main class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4"><i class="bi bi-box-arrow-in-right"></i> 用户登录</h3>

                        <div th:if="${param.error}" class="alert alert-danger">
                            <i class="bi bi-exclamation-triangle"></i> 用户名或密码错误
                        </div>
                        <div th:if="${param.registered}" class="alert alert-success">
                            <i class="bi bi-check-circle"></i> 注册成功，请登录
                        </div>
                        <div th:if="${param.logout}" class="alert alert-info">
                            <i class="bi bi-info-circle"></i> 已成功退出登录
                        </div>

                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label class="form-label">用户名</label>
                                <input type="text" name="username" class="form-control form-control-lg" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">密码</label>
                                <input type="password" name="password" class="form-control form-control-lg" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 btn-lg">登录</button>
                        </form>

                        <div class="text-center mt-3">
                            <span class="text-muted">还没有账号？</span>
                            <a href="/register">立即注册</a>
                        </div>

                        <div class="mt-3 p-3 bg-light rounded">
                            <p class="mb-1 small"><strong>测试账号：</strong></p>
                            <p class="mb-0 small">管理员：admin / admin123</p>
                            <p class="mb-0 small">普通用户：reader / reader123</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
