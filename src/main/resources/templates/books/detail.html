<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head(${book.title} + ' - 在线书屋')"></head>
<body>
    <nav th:replace="fragments/layout :: navbar"></nav>

    <main class="container mt-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">首页</a></li>
                <li class="breadcrumb-item"><a href="/books">书库</a></li>
                <li class="breadcrumb-item active" th:text="${book.title}">书名</li>
            </ol>
        </nav>

        <div class="row">
            <div class="col-md-3">
                <div class="card shadow-sm">
                    <div class="card-body text-center p-4">
                        <i class="bi bi-journal-richtext" style="font-size: 6rem; color: #0d6efd;"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-9">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="card-title" th:text="${book.title}">书名</h2>
                        <h5 class="text-muted" th:text="${book.author}">作者</h5>
                        <hr>
                        <p class="card-text" th:text="${book.description}">描述</p>
                        <div class="mt-3">
                            <span class="badge bg-info fs-6" th:text="${book.category}">分类</span>
                            <span class="badge bg-secondary fs-6 ms-2" th:text="|共 ${book.totalChapters} 章|">章节</span>
                        </div>
                        <div class="mt-4">
                            <a th:href="@{/reading/{bookId}(bookId=${book.id})}" class="btn btn-primary btn-lg">
                                <i class="bi bi-book-open"></i> 开始阅读
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm mt-4">
            <div class="card-header bg-white">
                <h5 class="mb-0"><i class="bi bi-list-ul"></i> 目录</h5>
            </div>
            <div class="card-body p-0">
                <div class="list-group list-group-flush">
                    <a th:each="chapter : ${chapters}"
                       th:href="@{/reading/{bookId}/{chapterNumber}(bookId=${book.id}, chapterNumber=${chapter.chapterNumber})}"
                       class="list-group-item list-group-item-action d-flex align-items-center">
                        <span class="badge bg-primary rounded-pill me-3" th:text="${chapter.chapterNumber}">1</span>
                        <span th:text="${chapter.title}">章节标题</span>
                        <i class="bi bi-chevron-right ms-auto"></i>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
